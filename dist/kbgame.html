<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080814">
<title>Press Any Key ✦</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: #080814;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var W = 1, H = 1, DPR = 1;
  var bgHue = 200;

  var particles = [];
  var rings = [];
  var letters = [];
  var blobs = [];

  var actx = null;
  var noteIdx = 0;
  var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];

  /* ------------------------------------------------------------------ */
  /*  SETUP                                                              */
  /* ------------------------------------------------------------------ */

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeBlobs();
  }

  function makeBlobs() {
    blobs.length = 0;
    for (var i = 0; i < 8; i++) {
      blobs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 90 + Math.random() * Math.min(W, H) * 0.45,
        hue: Math.random() * 360,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  });

  /* ------------------------------------------------------------------ */
  /*  AUDIO                                                              */
  /* ------------------------------------------------------------------ */

  function initAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        actx = null;
      }
    }
    if (actx && actx.state === 'suspended') {
      actx.resume();
    }
  }

  function freqForIndex(i) {
    var n = SCALE[i % SCALE.length] + 12 * Math.floor(i / SCALE.length);
    return 261.63 * Math.pow(2, n / 12);
  }

  function nextFreq() {
    noteIdx = (noteIdx + 1 + Math.floor(Math.random() * 3)) % 16;
    return freqForIndex(noteIdx);
  }

  function playNote(freq) {
    if (!actx) return;
    var t0 = actx.currentTime;

    var master = actx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.20, t0 + 0.02);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    master.connect(actx.destination);

    var filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(5200, t0);
    filt.frequency.exponentialRampToValueAtTime(1100, t0 + 0.9);
    filt.connect(master);

    var o1 = actx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq, t0);
    o1.connect(filt);

    var o2 = actx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2.003, t0);
    var g2 = actx.createGain();
    g2.gain.value = 0.38;
    o2.connect(g2);
    g2.connect(filt);

    o1.start(t0); o1.stop(t0 + 1.05);
    o2.start(t0); o2.stop(t0 + 1.05);
  }

  /* ------------------------------------------------------------------ */
  /*  EASING                                                             */
  /* ------------------------------------------------------------------ */

  function easeOutElastic(x) {
    var c4 = (2 * Math.PI) / 3;
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
  }

  /* ------------------------------------------------------------------ */
  /*  PARTICLE                                                           */
  /* ------------------------------------------------------------------ */

  function Particle(x, y, hue, power) {
    var a = Math.random() * Math.PI * 2;
    var sp = (1.5 + Math.random() * 7.5) * (power || 1);
    this.x = x;
    this.y = y;
    this.vx = Math.cos(a) * sp;
    this.vy = Math.sin(a) * sp;
    this.life = 1;
    this.decay = 0.009 + Math.random() * 0.013;
    this.size = 2 + Math.random() * 6;
    this.hue = hue + (Math.random() * 90 - 45);
  }

  Particle.prototype.update = function (dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    var damp = Math.pow(0.972, dt);
    this.vx *= damp;
    this.vy *= damp;
    this.vy += 0.045 * dt;
    this.life -= this.decay * dt;
  };

  Particle.prototype.draw = function () {
    var a = this.life > 0 ? this.life : 0;
    if (a <= 0.02) return;
    ctx.strokeStyle = 'hsla(' + this.hue + ',100%,' + (58 + 28 * a) + '%,' + a + ')';
    ctx.lineWidth = Math.max(0.6, this.size * a);
    ctx.beginPath();
    ctx.moveTo(this.x - this.vx * 1.4, this.y - this.vy * 1.4);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  };

  /* ------------------------------------------------------------------ */
  /*  LETTER                                                             */
  /* ------------------------------------------------------------------ */

  function Letter(ch, x, y, hue) {
    this.ch = ch;
    this.x = x;
    this.y = y;
    this.hue = hue;
    this.age = 0;
    this.life = 1.7;
    this.rot0 = (Math.random() - 0.5) * 0.9;
    this.phase = Math.random() * Math.PI * 2;
    this.baseSize = Math.min(W, H) * (ch.length > 1 ? 0.13 : 0.21);
  }

  Letter.prototype.update = function (dt) {
    this.age += dt / 60;
    this.y -= 0.5 * dt;
    this.phase += 0.09 * dt;
  };

  Letter.prototype.draw = function () {
    var t = Math.min(this.age / this.life, 1);
    var grow = easeOutElastic(Math.min(t * 2.5, 1));
    var fade = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;
    if (fade <= 0 || grow <= 0.001) return;

    var size = this.baseSize;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot0 * Math.sin(this.phase * 0.7));
    ctx.scale(grow, grow);
    ctx.globalAlpha = Math.max(0, fade);
    ctx.font = '900 ' + size + 'px "Trebuchet MS", "Arial Black", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    /* ---- SOFT NEON GLOW -------------------------------------------
       We do NOT use ctx.shadowBlur here: Safari renders text shadows
       badly (clipped, offset, or not at all) and it is slow. Instead
       we fake the glow with a few wide, very transparent strokes,
       drawn additively, before the solid glyph goes on top.          */
    ctx.globalCompositeOperation = 'lighter';

    var glowSteps = [
      { w: 0.34, a: 0.055, l: 58 },
      { w: 0.22, a: 0.085, l: 62 },
      { w: 0.13, a: 0.130, l: 68 }
    ];

    for (var i = 0; i < glowSteps.length; i++) {
      var s = glowSteps[i];
      ctx.lineWidth = size * s.w;
      ctx.strokeStyle = 'hsla(' + this.hue + ',100%,' + s.l + '%,' + s.a + ')';
      ctx.strokeText(this.ch, 0, 0);
    }

    /* ---- DARK OUTLINE (keeps the glyph readable on any background) */
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = size * 0.16;
    ctx.strokeStyle = 'rgba(8,0,28,0.45)';
    ctx.strokeText(this.ch, 0, 0);

    /* ---- GRADIENT FILL -------------------------------------------- */
    var g = ctx.createLinearGradient(-size * 0.5, -size * 0.5, size * 0.5, size * 0.5);
    g.addColorStop(0.0, 'hsl(' + this.hue + ',100%,82%)');
    g.addColorStop(0.5, 'hsl(' + ((this.hue + 55) % 360) + ',100%,68%)');
    g.addColorStop(1.0, 'hsl(' + ((this.hue + 120) % 360) + ',100%,74%)');
    ctx.fillStyle = g;
    ctx.fillText(this.ch, 0, 0);

    ctx.restore();
  };

  /* ------------------------------------------------------------------ */
  /*  SPAWN                                                              */
  /* ------------------------------------------------------------------ */

  function randomPos() {
    return {
      x: W * 0.5 + (Math.random() - 0.5) * W * 0.78,
      y: H * 0.5 + (Math.random() - 0.5) * H * 0.68
    };
  }

  function spawnAt(x, y, label, power) {
    var hue = Math.random() * 360;
    bgHue = (bgHue + 34) % 360;

    var count = Math.round(30 * (power || 1));
    for (var i = 0; i < count; i++) {
      particles.push(new Particle(x, y, hue, power));
    }
    if (particles.length > 1400) {
      particles.splice(0, particles.length - 1400);
    }

    rings.push({
      x: x, y: y,
      r: 8,
      maxR: Math.min(W, H) * 0.32 + Math.random() * Math.min(W, H) * 0.30,
      hue: hue,
      w: 9
    });

    if (label) {
      if (letters.length > 16) letters.shift();
      letters.push(new Letter(label, x, y, hue));
    }
  }

  /* ------------------------------------------------------------------ */
  /*  KEY LABEL                                                          */
  /* ------------------------------------------------------------------ */

  function keyLabel(e) {
    var k = e.key;
    if (!k || k === 'Unidentified' || k === 'Dead') return '✦';
    if (k === ' ') return '☆';
    if (k.length === 1) return k.toUpperCase();

    switch (k) {
      case 'Shift':      return '⇧';
      case 'Control':    return '⌃';
      case 'Alt':        return '⌥';
      case 'Meta':       return '⌘';
      case 'CapsLock':   return '⇪';
      case 'Enter':      return '⏎';
      case 'Backspace':  return '⌫';
      case 'Tab':        return '⇥';
      case 'Escape':     return '✕';
      case 'ArrowUp':    return '↑';
      case 'ArrowDown':  return '↓';
      case 'ArrowLeft':  return '←';
      case 'ArrowRight': return '→';
      case 'Delete':     return '⌦';
      case 'Home':       return '⇤';
      case 'End':        return '⇲';
      case 'PageUp':     return '⇞';
      case 'PageDown':   return '⇟';
      case 'Insert':     return '⎀';
      case 'NumLock':    return '⇭';
      case 'ScrollLock': return '⇳';
      case 'Pause':      return '❚❚';
      case 'ContextMenu':return '☰';
    }
    if (/^F\d{1,2}$/.test(k)) return k;
    return '✦';
  }

  /* ------------------------------------------------------------------ */
  /*  INPUT                                                              */
  /* ------------------------------------------------------------------ */

  window.addEventListener('keydown', function (e) {
    e.preventDefault();
    initAudio();

    if (e.repeat) {
      var p = randomPos();
      spawnAt(p.x, p.y, null, 0.35);
      return;
    }

    var pos = randomPos();
    spawnAt(pos.x, pos.y, keyLabel(e), 1);
    playNote(nextFreq());
  }, { passive: false });

  var POINTER_GLYPHS = ['★', '♥', '✿', '☀', '☘', '✈', '♪'];

  window.addEventListener('pointerdown', function (e) {
    initAudio();
    var g = POINTER_GLYPHS[Math.floor(Math.random() * POINTER_GLYPHS.length)];
    spawnAt(e.clientX, e.clientY, g, 1);
    playNote(nextFreq());
  }, { passive: true });

  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ------------------------------------------------------------------ */
  /*  RENDER                                                             */
  /* ------------------------------------------------------------------ */

  function drawBackground() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    var h = bgHue;
    var g = ctx.createLinearGradient(0, 0, W * 0.85, H);
    g.addColorStop(0.00, 'hsl(' + h + ',70%,9%)');
    g.addColorStop(0.45, 'hsl(' + ((h + 50) % 360) + ',75%,13%)');
    g.addColorStop(1.00, 'hsl(' + ((h + 120) % 360) + ',70%,7%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBlobs(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -b.r) b.x = W + b.r;
      else if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      else if (b.y > H + b.r) b.y = -b.r;

      var hue = (b.hue + bgHue) % 360;
      var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      rg.addColorStop(0, 'hsla(' + hue + ',95%,58%,0.13)');
      rg.addColorStop(1, 'hsla(' + hue + ',95%,58%,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRings(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      r.r += (r.maxR - r.r) * 0.075 * dt;
      var a = 1 - r.r / r.maxR;
      if (a <= 0.02) { rings.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'hsla(' + r.hue + ',100%,72%,' + (a * 0.85) + ')';
      ctx.lineWidth = Math.max(0.5, r.w * a);
      ctx.stroke();
    }
  }

  function drawParticles(dt) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.update(dt);
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.draw();
    }
  }

  function drawLetters(dt) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    for (var i = letters.length - 1; i >= 0; i--) {
      var l = letters[i];
      l.update(dt);
      if (l.age >= l.life) { letters.splice(i, 1); continue; }
      l.draw();
    }
  }

  /* ------------------------------------------------------------------ */
  /*  LOOP                                                               */
  /* ------------------------------------------------------------------ */

  var lastTime = 0;

  function frame(now) {
    if (!lastTime) lastTime = now;
    var dt = (now - lastTime) / 16.6667;
    lastTime = now;
    if (dt > 3) dt = 3;
    if (dt <= 0) dt = 1;

    bgHue = (bgHue + 0.22 * dt) % 360;

    drawBackground();
    drawBlobs(dt);
    drawRings(dt);
    drawParticles(dt);
    drawLetters(dt);

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ */
  /*  GO                                                                 */
  /* ------------------------------------------------------------------ */

  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
