<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Press Any Key">
<meta name="theme-color" content="#080814">
<title>Press Any Key ✦</title>
<style>
  html { height: 100%; overflow: hidden; }
  body {
    margin: 0; padding: 0;
    height: 100%; overflow: hidden;
    background: #080814;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #kbsink {
    position: fixed; top: 0; left: 0;
    width: 1px; height: 1px; opacity: 0;
    pointer-events: none; overflow: hidden;
    border: 0; outline: 0; color: transparent; background: transparent;
  }
  #hint {
    position: fixed;
    left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: 86vw; padding: 10px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.88);
    font: 500 14px/1.4 system-ui, -apple-system, sans-serif;
    text-align: center;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    pointer-events: none; opacity: 0;
    transition: opacity 0.6s ease; z-index: 10;
  }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="kbsink" contenteditable="true" virtualkeyboardpolicy="manual" aria-hidden="true" tabindex="-1"></div>
<div id="hint">点分享 →「添加到主屏幕」，从桌面启动即可全屏</div>

<script>
(function () {
  'use strict';

  /* ================================================================== */
  /*  PWA                                                               */
  /* ================================================================== */

  var isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    window.matchMedia('(display-mode: standalone)').matches;

  function makeIcon(size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    x.fillStyle = '#080814';
    x.fillRect(0, 0, size, size);
    x.fillStyle = '#141033';
    var r = size * 0.22;
    x.beginPath();
    x.moveTo(r, 0);
    x.arcTo(size, 0, size, size, r);
    x.arcTo(size, size, 0, size, r);
    x.arcTo(0, size, 0, 0, r);
    x.arcTo(0, 0, size, 0, r);
    x.closePath();
    x.fill();
    var g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.5);
    g.addColorStop(0, 'rgba(255,120,220,0.55)');
    g.addColorStop(0.6, 'rgba(120,180,255,0.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.beginPath();
    x.arc(size/2, size/2, size*0.48, 0, Math.PI*2);
    x.fill();
    x.fillStyle = '#ffffff';
    x.font = '900 ' + Math.round(size * 0.52) + 'px "Arial Black", Arial, sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('✦', size/2, size * 0.54);
    return c.toDataURL('image/png');
  }

  function setupPWA() {
    var icon512 = makeIcon(512);
    var icon180 = makeIcon(180);
    var ati = document.createElement('link');
    ati.rel = 'apple-touch-icon';
    ati.setAttribute('sizes', '180x180');
    ati.href = icon180;
    document.head.appendChild(ati);
    var ati2 = document.createElement('link');
    ati2.rel = 'apple-touch-icon';
    ati2.setAttribute('sizes', '512x512');
    ati2.href = icon512;
    document.head.appendChild(ati2);
    var fav = document.createElement('link');
    fav.rel = 'icon'; fav.type = 'image/png'; fav.href = icon512;
    document.head.appendChild(fav);
    var startUrl = location.href.split('#')[0].split('?')[0];
    var manifest = {
      name: 'Press Any Key',
      short_name: 'Any Key',
      description: 'A keyboard playground for very young children.',
      start_url: startUrl,
      scope: startUrl.replace(/[^/]*$/, ''),
      display: 'fullscreen',
      display_override: ['fullscreen', 'standalone'],
      orientation: 'any',
      background_color: '#080814',
      theme_color: '#080814',
      icons: [
        { src: icon180, sizes: '180x180', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ]
    };
    try {
      var mlink = document.createElement('link');
      mlink.rel = 'manifest';
      mlink.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(mlink);
    } catch (e) {}
  }

  setupPWA();

  if (!isStandalone && /iPad|iPhone|iPod/.test(navigator.userAgent)) {
    var hintEl = document.getElementById('hint');
    setTimeout(function () { hintEl.classList.add('show'); }, 1200);
    setTimeout(function () { hintEl.classList.remove('show'); }, 8000);
    var hideHint = function () {
      hintEl.classList.remove('show');
      window.removeEventListener('pointerdown', hideHint);
      window.removeEventListener('keydown', hideHint);
    };
    window.addEventListener('pointerdown', hideHint);
    window.addEventListener('keydown', hideHint);
  }

  /* ================================================================== */
  /*  KEYBOARD SINK                                                      */
  /* ================================================================== */

  var kbsink = document.getElementById('kbsink');
  function focusSink() {
    if (!kbsink) return;
    if (document.activeElement === kbsink) return;
    try { kbsink.focus({ preventScroll: true }); }
    catch (e) { try { kbsink.focus(); } catch (e2) {} }
  }
  document.addEventListener('pointerdown', focusSink, true);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(focusSink, 50);
  });

  /* ================================================================== */
  /*  CANVAS / CONSTANTS                                                 */
  /* ================================================================== */

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });

  var W = 1, H = 1, DPR = 1;
  var bgHue = 200;

  var particles = [];
  var rings = [];
  var letters = [];
  var blobs = [];
  var charges = new Map();

  var MAX_PARTICLES = 400;
  var MAX_RINGS = 6;
  var MAX_LETTERS = 6;
  var MAX_CHARGES = 4;
  var MAX_CHARGE_MS = 1300;

  var actx = null;
  var noteIdx = 0;
  var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];

  var measureCanvas = document.createElement('canvas');
  var measureCtx = measureCanvas.getContext('2d');

  var FONT = '"Trebuchet MS", "Arial Black", system-ui, sans-serif';
  var letterCache = new Map();
  var LETTER_CACHE_MAX = 48;

  var auraCache = new Map();

  var bgCanvas = document.createElement('canvas');
  var bgCtx = bgCanvas.getContext('2d');
  var lastBGHue = -999;

  /* ================================================================== */
  /*  SETUP                                                              */
  /* ================================================================== */

  function resize() {
    var smallScreen = Math.min(window.innerWidth, window.innerHeight) < 820;
    var maxDPR = smallScreen ? 1.5 : 2;
    DPR = Math.min(window.devicePixelRatio || 1, maxDPR);
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    MAX_PARTICLES = smallScreen ? 320 : 500;
    MAX_RINGS     = smallScreen ? 5   : 8;
    MAX_LETTERS   = smallScreen ? 5   : 7;

    letterCache.clear();
    buildBgCache();
    makeBlobs();
  }

  function buildBgCache() {
    bgCanvas.width  = Math.round(W * DPR);
    bgCanvas.height = Math.round(H * DPR);
    renderBgToCache(bgHue);
    lastBGHue = bgHue;
  }

  function renderBgToCache(h) {
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = bgCtx.createLinearGradient(0, 0, W * 0.85, H);
    g.addColorStop(0.00, 'hsl(' + h + ',70%,9%)');
    g.addColorStop(0.45, 'hsl(' + ((h + 50) % 360) + ',75%,13%)');
    g.addColorStop(1.00, 'hsl(' + ((h + 120) % 360) + ',70%,7%)');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W, H);
  }

  function makeBlobs() {
    blobs.length = 0;
    var n = Math.min(window.innerWidth, window.innerHeight) < 820 ? 4 : 6;
    for (var i = 0; i < n; i++) {
      var hue = Math.random() * 360;
      blobs.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 90 + Math.random() * Math.min(W, H) * 0.30,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        sprite: createBlobSprite(hue)
      });
    }
  }

  function createBlobSprite(hue) {
    var size = 160;
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var x = c.getContext('2d');
    var rg = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    rg.addColorStop(0,   'hsla(' + hue + ',95%,58%,0.14)');
    rg.addColorStop(0.5, 'hsla(' + hue + ',95%,58%,0.055)');
    rg.addColorStop(1,   'hsla(' + hue + ',95%,58%,0)');
    x.fillStyle = rg;
    x.fillRect(0, 0, size, size);
    return c;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ================================================================== */
  /*  AUDIO                                                              */
  /* ================================================================== */

  function initAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }

  function freqForIndex(i) {
    var n = SCALE[i % SCALE.length] + 12 * Math.floor(i / SCALE.length);
    return 261.63 * Math.pow(2, n / 12);
  }

  function playNote(freq, vol) {
    if (!actx) return;
    var t0 = actx.currentTime;
    var volume = (typeof vol === 'number') ? vol : 0.18;

    var master = actx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(Math.max(volume, 0.001), t0 + 0.02);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.0);
    master.connect(actx.destination);

    var filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(5200, t0);
    filt.frequency.exponentialRampToValueAtTime(1100, t0 + 0.9);
    filt.connect(master);

    var o1 = actx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq, t0);
    o1.connect(filt);

    var o2 = actx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2.003, t0);
    var g2 = actx.createGain();
    g2.gain.value = 0.36;
    o2.connect(g2);
    g2.connect(filt);

    o1.start(t0); o1.stop(t0 + 1.05);
    o2.start(t0); o2.stop(t0 + 1.05);
  }

  /* ------------------------------------------------------------------ */
  /*  CHARGE TONE — warm plucked ticks, rising with the charge.          */
  /*                                                                     */
  /*  The old version was a slow sine glide from half-frequency upward,  */
  /*  which read as a horror-movie riser. This version plays a series    */
  /*  of short, soft, triangle-wave plucks that climb the scale as the   */
  /*  charge fills — like a bubble counter or an old arcade power-up.    */
  /* ------------------------------------------------------------------ */

  function chargeTick(charge) {
    if (!actx || actx.state !== 'running') return;

    var p = charge.progress(performance.now());
    // climb up to 12 semitones (one octave) above the base pitch
    var step = Math.floor(p * 12);
    var freq = charge.baseFreq * Math.pow(2, step / 12);

    // gentle: quiet ticks that swell a little as the charge fills
    var vol = 0.032 + p * 0.028;
    var t0 = actx.currentTime;
    var dur = 0.14;

    var o1 = actx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.setValueAtTime(freq, t0);

    var o2 = actx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq * 2.001, t0);

    var g2 = actx.createGain();
    g2.gain.value = 0.30;

    var filt = actx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 3200;

    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o1.connect(filt);
    o2.connect(g2);
    g2.connect(filt);
    filt.connect(g);
    g.connect(actx.destination);

    o1.start(t0); o1.stop(t0 + dur + 0.02);
    o2.start(t0); o2.stop(t0 + dur + 0.02);
  }

  function scheduleNextTick(charge) {
    if (charge.stopped) return;
    var p = charge.progress(performance.now());
    // ticks accelerate: ~150ms at start → ~88ms at full charge
    var interval = 150 - p * 62;
    charge.tickTimer = setTimeout(function () {
      if (charge.stopped) return;
      chargeTick(charge);
      scheduleNextTick(charge);
    }, interval);
  }

  function startChargeTone(charge) {
    if (!actx) return;
    charge.stopped = false;
    chargeTick(charge);           // instant feedback on press
    scheduleNextTick(charge);
  }

  function stopChargeTone(charge) {
    charge.stopped = true;
    if (charge.tickTimer) {
      clearTimeout(charge.tickTimer);
      charge.tickTimer = null;
    }
  }

  /* ================================================================== */
  /*  EASING                                                             */
  /* ================================================================== */

  function easeOutElastic(x) {
    var c4 = (2 * Math.PI) / 3;
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
  }

  /* ================================================================== */
  /*  PARTICLE                                                           */
  /* ================================================================== */

  function Particle(x, y, hue, power) {
    var a = Math.random() * Math.PI * 2;
    var sp = (1.5 + Math.random() * 7.5) * (power || 1);
    this.x = x;
    this.y = y;
    this.vx = Math.cos(a) * sp;
    this.vy = Math.sin(a) * sp;
    this.life = 1;
    this.decay = 0.009 + Math.random() * 0.013;
    this.size = 2 + Math.random() * 6;
    this.hue = hue + (Math.random() * 90 - 45);
  }

  Particle.prototype.update = function (dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    var damp = Math.pow(0.972, dt);
    this.vx *= damp;
    this.vy *= damp;
    this.vy += 0.045 * dt;
    this.life -= this.decay * dt;
  };

  Particle.prototype.draw = function () {
    var a = this.life;
    if (a <= 0.02) return;
    if (a > 1) a = 1;
    var s = this.size * a;
    if (s < 0.7) s = 0.7;
    ctx.fillStyle = 'hsla(' + this.hue + ',100%,' + (58 + 28 * a) + '%,' + a + ')';
    ctx.fillRect(this.x - s * 0.5, this.y - s * 0.5, s, s);
  };

  /* ================================================================== */
  /*  LETTER SPRITE / CACHE                                              */
  /* ================================================================== */

  function hueBucket(hue) {
    return Math.round(hue / 15) % 24;
  }

  function createLetterSprite(ch, hue, baseSize) {
    var font = '900 ' + baseSize + 'px ' + FONT;
    measureCtx.font = font;
    var textW = measureCtx.measureText(ch).width;

    var pad = baseSize * 0.55;
    var cssW = Math.max(baseSize * 1.0, textW + pad * 2);
    var cssH = baseSize * 1.55 + pad * 2;

    var res = 1.5;
    var c = document.createElement('canvas');
    c.width  = Math.ceil(cssW * res);
    c.height = Math.ceil(cssH * res);
    var x = c.getContext('2d');
    x.setTransform(res, 0, 0, res, 0, 0);
    x.translate(cssW / 2, cssH / 2);
    x.font = font;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.lineJoin = 'round';
    x.lineCap = 'round';

    x.globalCompositeOperation = 'lighter';
    var glowSteps = [
      { w: 0.34, a: 0.055, l: 58 },
      { w: 0.22, a: 0.085, l: 62 },
      { w: 0.13, a: 0.130, l: 68 }
    ];
    for (var i = 0; i < glowSteps.length; i++) {
      var s = glowSteps[i];
      x.lineWidth = baseSize * s.w;
      x.strokeStyle = 'hsla(' + hue + ',100%,' + s.l + '%,' + s.a + ')';
      x.strokeText(ch, 0, 0);
    }

    x.globalCompositeOperation = 'source-over';
    x.lineWidth = baseSize * 0.16;
    x.strokeStyle = 'rgba(8,0,28,0.45)';
    x.strokeText(ch, 0, 0);

    var g = x.createLinearGradient(-baseSize * 0.5, -baseSize * 0.5, baseSize * 0.5, baseSize * 0.5);
    g.addColorStop(0.0, 'hsl(' + hue + ',100%,82%)');
    g.addColorStop(0.5, 'hsl(' + ((hue + 55) % 360) + ',100%,68%)');
    g.addColorStop(1.0, 'hsl(' + ((hue + 120) % 360) + ',100%,74%)');
    x.fillStyle = g;
    x.fillText(ch, 0, 0);

    return { canvas: c, cssW: cssW, cssH: cssH };
  }

  function getLetterSprite(ch, baseSize, hue) {
    var hb = hueBucket(hue);
    var key = ch + '|' + Math.round(baseSize) + '|' + hb;
    var hit = letterCache.get(key);
    if (hit) {
      letterCache.delete(key);
      letterCache.set(key, hit);
      return hit;
    }
    var sprite = createLetterSprite(ch, hb * 15, baseSize);
    letterCache.set(key, sprite);
    if (letterCache.size > LETTER_CACHE_MAX) {
      var first = letterCache.keys().next().value;
      letterCache.delete(first);
    }
    return sprite;
  }

  /* ================================================================== */
  /*  AURA SPRITE (for charging)                                         */
  /* ================================================================== */

  function createAuraSprite(hue) {
    var size = 200;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    var rg = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    rg.addColorStop(0,   'hsla(' + hue + ',100%,70%,1)');
    rg.addColorStop(0.4, 'hsla(' + hue + ',100%,65%,0.5)');
    rg.addColorStop(1,   'hsla(' + hue + ',100%,60%,0)');
    x.fillStyle = rg;
    x.fillRect(0, 0, size, size);
    return c;
  }

  function getAuraSprite(hue) {
    var hb = hueBucket(hue);
    var hit = auraCache.get(hb);
    if (hit) return hit;
    var sprite = createAuraSprite(hb * 15);
    auraCache.set(hb, sprite);
    return sprite;
  }

  /* ================================================================== */
  /*  CHARGE                                                             */
  /* ================================================================== */

  function Charge(id, label, hue, x, y) {
    this.id = id;
    this.label = label;
    this.hue = hue;
    this.x = x;
    this.y = y;
    this.startTime = performance.now();
    this.baseFreq = 440;

    var s = Math.min(W, H) * (label.length > 1 ? 0.13 : 0.21);
    this.baseSize = s;
    this.maxSize = s * 1.4;
    this.sprite = getLetterSprite(label, this.maxSize, hue);
    this.aura = getAuraSprite(hue);

    this.tickTimer = null;
    this.stopped = false;
  }

  Charge.prototype.progress = function (now) {
    var p = (now - this.startTime) / MAX_CHARGE_MS;
    return p > 1 ? 1 : (p < 0 ? 0 : p);
  };

  Charge.prototype.drawAura = function (now) {
    var p = this.progress(now);
    var pulse = 0.5 + 0.5 * Math.sin(now * 0.006);

    var auraR = this.baseSize * (1.3 + 0.5 * p + 0.1 * pulse * p);
    var auraAlpha = 0.15 + p * 0.45;
    ctx.globalAlpha = auraAlpha;
    ctx.drawImage(this.aura, this.x - auraR, this.y - auraR, auraR * 2, auraR * 2);
    ctx.globalAlpha = 1;

    var ringR = this.baseSize * (0.7 + 0.5 * p + 0.1 * pulse);
    ctx.beginPath();
    ctx.arc(this.x, this.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = 'hsla(' + this.hue + ',100%,78%,' + (0.3 + p * 0.6) + ')';
    ctx.lineWidth = 1.5 + p * 5;
    ctx.stroke();
  };

  Charge.prototype.drawSprite = function (now) {
    var p = this.progress(now);
    var size = this.baseSize * (0.7 + 0.6 * p);
    var scale = size / this.maxSize;
    ctx.globalAlpha = 0.75 + p * 0.25;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(now * 0.004 + this.hue) * 0.04);
    ctx.scale(scale, scale);
    ctx.drawImage(this.sprite.canvas,
      -this.sprite.cssW / 2, -this.sprite.cssH / 2,
      this.sprite.cssW, this.sprite.cssH);
    ctx.restore();
    ctx.globalAlpha = 1;
  };

  /* ================================================================== */
  /*  LETTER (released)                                                  */
  /* ================================================================== */

  function Letter(ch, x, y, baseSize, hue) {
    this.sprite = getLetterSprite(ch, baseSize, hue);
    this.x = x;
    this.y = y;
    this.age = 0;
    this.life = 1.7;
    this.rot0 = (Math.random() - 0.5) * 0.9;
    this.phase = Math.random() * Math.PI * 2;
  }

  Letter.prototype.update = function (dt) {
    this.age += dt / 60;
    this.y -= 0.5 * dt;
    this.phase += 0.09 * dt;
  };

  Letter.prototype.draw = function () {
    var t = Math.min(this.age / this.life, 1);
    var grow = easeOutElastic(Math.min(t * 2.5, 1));
    var fade = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;
    if (fade <= 0 || grow <= 0.001) return;

    var s = this.sprite;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot0 * Math.sin(this.phase * 0.7));
    ctx.scale(grow, grow);
    ctx.globalAlpha = Math.max(0, fade);
    ctx.drawImage(s.canvas, -s.cssW / 2, -s.cssH / 2, s.cssW, s.cssH);
    ctx.restore();
  };

  /* ================================================================== */
  /*  SPAWN                                                              */
  /* ================================================================== */

  function randomPos() {
    return {
      x: W * 0.5 + (Math.random() - 0.5) * W * 0.78,
      y: H * 0.5 + (Math.random() - 0.5) * H * 0.68
    };
  }

  function spawnAt(x, y, label, power, hueOverride, sizeBoost) {
    var hue = (typeof hueOverride === 'number') ? hueOverride : Math.random() * 360;
    bgHue = (bgHue + 34) % 360;

    var count = Math.round(30 * power);
    if (count > 120) count = 120;
    for (var i = 0; i < count; i++) {
      particles.push(new Particle(x, y, hue, power));
    }
    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }

    if (rings.length >= MAX_RINGS) rings.shift();
    rings.push({
      x: x, y: y,
      r: 8,
      maxR: Math.min(W, H) * (0.20 + Math.min(power, 4) * 0.08) +
            Math.random() * Math.min(W, H) * 0.18,
      hue: hue,
      w: 6 + Math.min(power, 4) * 1.5
    });

    if (label) {
      if (letters.length >= MAX_LETTERS) letters.shift();
      var baseSize = Math.min(W, H) * (label.length > 1 ? 0.13 : 0.21);
      if (sizeBoost) baseSize *= sizeBoost;
      letters.push(new Letter(label, x, y, baseSize, hue));
    }
  }

  /* ================================================================== */
  /*  CHARGE MANAGEMENT                                                  */
  /* ================================================================== */

  function addCharge(id, label, x, y) {
    if (charges.size >= MAX_CHARGES) {
      var oldestId = charges.keys().next().value;
      releaseCharge(oldestId, true);
    }

    var hue = Math.random() * 360;
    noteIdx = (noteIdx + 1 + Math.floor(Math.random() * 3)) % 16;

    var charge = new Charge(id, label, hue, x, y);
    charge.baseFreq = freqForIndex(noteIdx);
    charges.set(id, charge);

    initAudio();
    startChargeTone(charge);
  }

  function releaseCharge(id, silent) {
    var charge = charges.get(id);
    if (!charge) return;
    charges.delete(id);

    var now = performance.now();
    var p = charge.progress(now);
    var power = 1 + p * 3;
    var sizeBoost = 1 + Math.round(p * 3) * 0.1;

    spawnAt(charge.x, charge.y, charge.label, power, charge.hue, sizeBoost);

    if (!silent && actx) {
      var freq = charge.baseFreq * Math.pow(2, p * 0.6);
      playNote(freq, 0.14 + p * 0.14);
    }

    stopChargeTone(charge);
  }

  function releaseAllCharges(silent) {
    var ids = Array.from(charges.keys());
    for (var i = 0; i < ids.length; i++) releaseCharge(ids[i], silent);
  }

  /* ================================================================== */
  /*  KEY LABEL                                                          */
  /* ================================================================== */

  function keyLabel(e) {
    var k = e.key;
    if (!k || k === 'Unidentified' || k === 'Dead') return '✦';
    if (k === ' ') return '☆';
    if (k.length === 1) return k.toUpperCase();

    switch (k) {
      case 'Shift':      return '⇧';
      case 'Control':    return '⌃';
      case 'Alt':        return '⌥';
      case 'Meta':       return '⌘';
      case 'CapsLock':   return '⇪';
      case 'Enter':      return '⏎';
      case 'Backspace':  return '⌫';
      case 'Tab':        return '⇥';
      case 'Escape':     return '✕';
      case 'ArrowUp':    return '↑';
      case 'ArrowDown':  return '↓';
      case 'ArrowLeft':  return '←';
      case 'ArrowRight': return '→';
      case 'Delete':     return '⌦';
      case 'Home':       return '⇤';
      case 'End':        return '⇲';
      case 'PageUp':     return '⇞';
      case 'PageDown':   return '⇟';
      case 'Insert':     return '⎀';
      case 'NumLock':    return '⇭';
      case 'ScrollLock': return '⇳';
      case 'Pause':      return '❚❚';
      case 'ContextMenu':return '☰';
    }
    if (/^F\d{1,2}$/.test(k)) return k;
    return '✦';
  }

  /* ================================================================== */
  /*  INPUT                                                              */
  /* ================================================================== */

  window.addEventListener('keydown', function (e) {
    if (e.repeat) {
      e.preventDefault();
      return;
    }

    e.preventDefault();
    e.stopPropagation();
    initAudio();

    var code = e.code || e.key || 'unk';
    var id = 'key:' + code;
    if (charges.has(id)) return;

    var label = keyLabel(e);
    var pos = randomPos();
    addCharge(id, label, pos.x, pos.y);
  }, { passive: false });

  window.addEventListener('keyup', function (e) {
    var code = e.code || e.key || 'unk';
    var id = 'key:' + code;
    if (charges.has(id)) releaseCharge(id);
  }, { passive: false });

  var POINTER_GLYPHS = ['★', '♥', '✿', '☀', '☘', '✈', '♪'];

  window.addEventListener('pointerdown', function (e) {
    initAudio();
    var id = 'ptr:' + e.pointerId;
    if (charges.has(id)) return;
    var label = POINTER_GLYPHS[Math.floor(Math.random() * POINTER_GLYPHS.length)];
    addCharge(id, label, e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('pointermove', function (e) {
    var id = 'ptr:' + e.pointerId;
    var charge = charges.get(id);
    if (charge) {
      charge.x = e.clientX;
      charge.y = e.clientY;
    }
  }, { passive: true });

  window.addEventListener('pointerup', function (e) {
    var id = 'ptr:' + e.pointerId;
    if (charges.has(id)) releaseCharge(id);
  }, { passive: true });

  window.addEventListener('pointercancel', function (e) {
    var id = 'ptr:' + e.pointerId;
    if (charges.has(id)) releaseCharge(id, true);
  }, { passive: true });

  window.addEventListener('blur', function () { releaseAllCharges(true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) releaseAllCharges(true);
  });

  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ================================================================== */
  /*  RENDER                                                             */
  /* ================================================================== */

  function drawBlobs(dt) {
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -b.r) b.x = W + b.r;
      else if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      else if (b.y > H + b.r) b.y = -b.r;

      var d = b.r * 2;
      ctx.drawImage(b.sprite, b.x - b.r, b.y - b.r, d, d);
    }
  }

  function drawRings(dt) {
    for (var i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      r.r += (r.maxR - r.r) * 0.075 * dt;
      var a = 1 - r.r / r.maxR;
      if (a <= 0.02) { rings.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'hsla(' + r.hue + ',100%,72%,' + (a * 0.85) + ')';
      ctx.lineWidth = Math.max(0.5, r.w * a);
      ctx.stroke();
    }
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.update(dt);
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.draw();
    }
  }

  function drawChargesAura(now) {
    charges.forEach(function (charge) { charge.drawAura(now); });
  }

  function drawChargesSprites(now) {
    charges.forEach(function (charge) { charge.drawSprite(now); });
  }

  function drawLetters(dt) {
    for (var i = letters.length - 1; i >= 0; i--) {
      var l = letters[i];
      l.update(dt);
      if (l.age >= l.life) { letters.splice(i, 1); continue; }
      l.draw();
    }
  }

  /* ================================================================== */
  /*  LOOP                                                               */
  /* ================================================================== */

  var lastTime = 0;

  function frame(now) {
    if (!lastTime) lastTime = now;
    var dt = (now - lastTime) / 16.6667;
    lastTime = now;
    if (dt > 3) dt = 3;
    if (dt <= 0) dt = 1;

    bgHue = (bgHue + 0.22 * dt) % 360;

    if (Math.abs(bgHue - lastBGHue) > 3) {
      renderBgToCache(bgHue);
      lastBGHue = bgHue;
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.restore();

    ctx.globalCompositeOperation = 'lighter';
    drawBlobs(dt);
    drawRings(dt);
    drawParticles(dt);
    if (charges.size > 0) drawChargesAura(now);

    ctx.globalCompositeOperation = 'source-over';
    if (charges.size > 0) drawChargesSprites(now);
    drawLetters(dt);

    requestAnimationFrame(frame);
  }

  /* ================================================================== */
  /*  GO                                                                 */
  /* ================================================================== */

  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
